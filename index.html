<!DOCTYPE html>
<html>
<head>
  <title>Finance Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header>
  <h1>💰 My Finance Tracker</h1>

  <div>
    <p style="font-size:12px;color:gray;">Switch role:</p>
    <div class="role-toggle">
      <button id="viewerBtn" class="active">Viewer</button>
      <button id="adminBtn">Admin</button>
    </div>
  </div>
</header>

<div class="cards">
  <div class="card" id="balance"></div>
  <div class="card" id="income"></div>
  <div class="card" id="expenses"></div>
</div>

<div class="charts">
  <div class="chart-box"><canvas id="lineChart"></canvas></div>
  <div class="chart-box"><canvas id="pieChart"></canvas></div>
</div>

<h2>📊 Transaction History</h2>
<input type="text" id="search" placeholder="Filter by category...">

<table id="table">
  <thead>
    <tr>
      <th>Date</th>
      <th>Amount (₹)</th>
      <th>Category</th>
      <th>Type</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div class="admin-wrapper">
  <div id="adminControls" class="admin-card">
    <h3>➕ Add Transaction</h3>
    <p class="hint">Switch to Admin mode to add transactions</p>

    <div class="form-group">
      <input id="amount" type="number" placeholder="Enter amount (₹)">
    </div>

    <div class="form-group">
      <input id="category" placeholder="Enter category (Food, Travel...)">
    </div>

    <div class="form-group">
      <select id="type">
        <option value="income">💰 Income</option>
        <option value="expense">💸 Expense</option>
      </select>
    </div>

    <button class="add-btn" onclick="addTransaction()">Add Transaction</button>
  </div>
</div>

<h2>💡 Insights</h2>
<div id="insights"></div>

<script src="script.js"></script>

</body>
</html>
